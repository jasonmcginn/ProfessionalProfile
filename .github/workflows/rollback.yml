name: Roll back to a release

# Run by hand from the Actions tab: pick a release tag, and the exact site
# saved with that release (site-<tag>.zip) goes back live. No rebuild, so it
# does not depend on Hugo, the theme, or the current code.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to put back live (for example v2.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    name: Redeploy a saved release
    steps:
      - name: Download the saved site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tags look like v2.1.0 (got: $TAG)"; exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "site-$TAG.zip"
          mkdir rollback && unzip -q "site-$TAG.zip" -d rollback
          test -f rollback/index.html

      - name: Deploy to production (Azure Static Web Apps)
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "rollback"
          skip_app_build: true
          skip_api_build: true
