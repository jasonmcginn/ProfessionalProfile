name: Release

# Publishing a GitHub Release (tag like v2.1.0) is the ONLY way to go live.
# Each release:
#   1. builds the site from the release tag
#   2. attaches the built site as site-<tag>.zip to the release (the saved copy)
#   3. builds the container image, scans it, and pushes it to ghcr.io as <tag> and latest
#   4. deploys that same build to production on Azure Static Web Apps
# If any step fails, nothing goes live.

on:
  release:
    types: [published]

permissions:
  contents: write   # attach the zip to the release
  packages: write   # push the image to ghcr.io

concurrency:
  group: production
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    name: Build, save, publish, deploy
    steps:
      - name: Check the release name
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must look like v2.1.0 (got: $TAG)"; exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.TAG }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.168.0'
          extended: true

      - name: Build site
        run: hugo --minify --source site

      - name: Save the built site to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd site/public && zip -qr "$GITHUB_WORKSPACE/site-$TAG.zip" .)
          gh release upload "$TAG" "site-$TAG.zip" --clobber

      - name: Build container image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.version="$TAG" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" .

      - name: Install Trivy
        # The same installer, at the same commit, that the scan action below
        # calls internally. Installed here so the database step can use it.
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.0
          cache: 'true'

      - name: Download the vulnerability database (with retries)
        # A dropped download of this database stopped release v2.4.0 twice,
        # before the scan could even start. Try each official location in
        # turn, for up to three rounds, and fail only if none of them works.
        run: |
          DB_DIR="$GITHUB_WORKSPACE/.cache/trivy"
          for round in 1 2 3; do
            for repo in mirror.gcr.io/aquasec/trivy-db:2 ghcr.io/aquasecurity/trivy-db:2; do
              echo "Round $round: downloading the vulnerability database from $repo"
              if trivy image --download-db-only --cache-dir "$DB_DIR" --db-repository "$repo"; then
                echo "Database downloaded from $repo"
                exit 0
              fi
              echo "Download from $repo failed"
            done
            sleep $((round * 20))
          done
          echo "Could not download the vulnerability database from any location"
          exit 1

      - name: Scan image for vulnerabilities
        # Pinned to a commit SHA: trivy-action tags were hijacked in March 2026
        # (CVE-2026-33634), so tags alone are not trusted here.
        # The database was downloaded by the step above, so the scan uses that
        # copy (TRIVY_SKIP_DB_UPDATE) and never restores an older cached one.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          skip-setup-trivy: true
          cache: 'false'
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_SKIP_DB_UPDATE: true

      - name: Push image to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Deploy to production (Azure Static Web Apps)
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "site/public"
          skip_app_build: true
          skip_api_build: true
