{{ define "main" }}
<div class="storyview"><div class="wrap story">
  <a class="backlink mono" href="/">&#8592; back</a>
  {{ partial "typeline.html" . }}
  <h1>{{ .Title }}</h1>
  {{ with .Params.hook }}<p class="hook">{{ . | safeHTML }}</p>{{ end }}
  <div class="story-body">{{ .Content }}</div>
  {{ partial "resources.html" . }}
</div></div>
{{ end }}
